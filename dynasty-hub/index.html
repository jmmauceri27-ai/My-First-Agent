<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulldog Playbook — MSU Dynasty Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23660022'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root {
  --maroon: #6a0022;
  --maroon-bright: #8c1d3f;
  --maroon-deep: #470017;
  --bg: #0e0b0d;
  --bg-elev: #171315;
  --card: #1d181b;
  --card-hover: #251e22;
  --border: #322a2e;
  --text: #f3eef0;
  --text-dim: #b9aeb3;
  --text-faint: #7d7176;
  --danger: #e05a5a;
  --shadow: 0 10px 30px rgba(0,0,0,0.45);
  --radius: 14px;
  --radius-sm: 9px;
}

:root[data-theme="light"] {
  --bg: #f6f3f2;
  --bg-elev: #ffffff;
  --card: #ffffff;
  --card-hover: #fbf3f5;
  --border: #e6dde0;
  --text: #241419;
  --text-dim: #5b4a50;
  --text-faint: #948589;
  --shadow: 0 8px 24px rgba(106,0,34,0.10);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  transition: background 0.25s ease, color 0.25s ease;
}

.app { max-width: 1180px; margin: 0 auto; padding-bottom: 60px; }

/* ---------- Hero / Header ---------- */
.hero {
  position: relative;
  background: linear-gradient(155deg, var(--maroon-deep) 0%, var(--maroon) 55%, var(--maroon-bright) 100%);
  border-radius: 0 0 28px 28px;
  padding: 28px 32px 0;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.hero-glow {
  position: absolute;
  top: -60px; right: -60px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 70%);
  pointer-events: none;
}
.hero-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.brand { display: flex; align-items: center; gap: 16px; }
.paw { color: rgba(255,255,255,0.92); flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
.brand-text { display: flex; flex-direction: column; gap: 2px; }
.eyebrow {
  font-size: 12.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.72);
  font-weight: 600;
}
#dynastyName {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.01em;
  outline: none;
  border-bottom: 1px dashed transparent;
}
#dynastyName:hover, #dynastyName:focus { border-bottom-color: rgba(255,255,255,0.4); }

.hero-right { display: flex; align-items: center; gap: 12px; }
.record-tracker {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.22);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 999px;
  padding: 6px 8px 6px 16px;
}
.record-tracker .stat { display: flex; align-items: baseline; gap: 5px; color: #fff; }
.record-tracker .stat span { font-size: 20px; font-weight: 800; }
.record-tracker .stat label { font-size: 11px; color: rgba(255,255,255,0.7); text-transform: uppercase; }
.record-tracker .sep { color: rgba(255,255,255,0.5); font-weight: 700; }

.icon-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.08);
  color: #fff;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s ease, transform 0.15s ease;
}
.icon-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }

.tabs {
  display: flex;
  gap: 4px;
  margin-top: 24px;
  padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.14);
  overflow-x: auto;
}
.tab-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.65);
  font-size: 14.5px;
  font-weight: 600;
  padding: 12px 18px;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color 0.15s ease;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active { color: #fff; }
.tab-btn.active::after {
  content: "";
  position: absolute;
  left: 12px; right: 12px; bottom: -1px;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: #fff;
}

/* ---------- Main / panels ---------- */
main { padding: 28px 24px 0; }
.tab-panel { display: none; animation: fadeIn 0.25s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.summary-card.accent { border-color: var(--maroon-bright); background: linear-gradient(160deg, var(--card), rgba(106,0,34,0.16)); }
.summary-num { font-size: 30px; font-weight: 800; }
.summary-label { color: var(--text-dim); font-size: 13px; font-weight: 500; }

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 12px;
  flex-wrap: wrap;
}
.panel-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }

.recent-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.recent-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.recent-item .tag-pill { flex-shrink: 0; }
.recent-item .r-title { font-weight: 700; font-size: 14.5px; }
.recent-item .r-sub { color: var(--text-faint); font-size: 12.5px; margin-left: auto; }
.empty-msg { color: var(--text-faint); font-size: 14px; padding: 20px 4px; }

/* ---------- Filters ---------- */
.filter-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.search-input {
  flex: 1;
  min-width: 220px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
}
.search-input:focus { border-color: var(--maroon-bright); }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip:hover { color: var(--text); border-color: var(--maroon-bright); }
.chip.active { background: var(--maroon); color: #fff; border-color: var(--maroon); }

/* ---------- Cards ---------- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--maroon-bright); background: var(--card-hover); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { font-size: 16px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.card-actions { display: flex; gap: 6px; flex-shrink: 0; }
.card-actions button {
  background: none; border: none; cursor: pointer;
  color: var(--text-faint); font-size: 14px; padding: 2px 4px; border-radius: 6px;
}
.card-actions button:hover { color: var(--text); background: rgba(128,128,128,0.15); }
.tag-pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(106,0,34,0.16);
  color: var(--maroon-bright);
  border: 1px solid rgba(106,0,34,0.35);
  width: fit-content;
}
.tag-pill.side-defense { background: rgba(90,90,90,0.18); color: var(--text-dim); border-color: var(--border); }
.card-meta { color: var(--text-dim); font-size: 13px; }
.card-body { color: var(--text); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.mini-tag {
  font-size: 11px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text-faint);
  padding: 3px 8px;
  border-radius: 6px;
}
.stars { color: var(--maroon-bright); font-size: 14px; letter-spacing: 1px; }

/* ---------- Buttons ---------- */
.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(135deg, var(--maroon-bright), var(--maroon)); color: #fff; box-shadow: 0 4px 14px rgba(106,0,34,0.35); }
.btn.primary:hover { opacity: 0.92; }
.btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }
.btn.ghost:hover { color: var(--text); border-color: var(--maroon-bright); }
.btn.ghost.danger:hover { color: var(--danger); border-color: var(--danger); }

/* ---------- Footer toolbar ---------- */
.toolbar {
  max-width: 1180px;
  margin: 40px auto 0;
  padding: 18px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.toolbar-hint { color: var(--text-faint); font-size: 12.5px; }
.toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  z-index: 100;
  backdrop-filter: blur(2px);
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 16px; font-size: 19px; font-weight: 800; }
.field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
.field input[type="text"],
.field input[type="number"],
.field select,
.field textarea {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: vertical;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--maroon-bright); }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.star-picker { display: flex; gap: 4px; }
.star-picker button {
  background: none; border: none; cursor: pointer;
  font-size: 22px; color: var(--border); line-height: 1;
}
.star-picker button.filled { color: var(--maroon-bright); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translate(-50%, 20px);
  background: var(--maroon);
  color: #fff;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Responsive ---------- */
@media (max-width: 700px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .hero { padding: 22px 18px 0; }
  #dynastyName { font-size: 24px; }
  main { padding: 22px 14px 0; }
}
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <div class="hero-glow"></div>
    <div class="hero-inner">
      <div class="brand">
        <svg class="paw" width="46" height="46" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <ellipse cx="32" cy="42" rx="17" ry="14"/>
          <ellipse cx="12" cy="24" rx="7" ry="9" transform="rotate(-20 12 24)"/>
          <ellipse cx="26" cy="14" rx="7.5" ry="10"/>
          <ellipse cx="38" cy="14" rx="7.5" ry="10"/>
          <ellipse cx="52" cy="24" rx="7" ry="9" transform="rotate(20 52 24)"/>
        </svg>
        <div class="brand-text">
          <span class="eyebrow">Mississippi State Bulldogs · Dynasty Mode</span>
          <h1 id="dynastyName" contenteditable="true" spellcheck="false">My Dynasty Hub</h1>
        </div>
      </div>

      <div class="hero-right">
        <div class="record-tracker" id="recordTracker">
          <div class="stat"><span id="winsVal">0</span><label>W</label></div>
          <div class="stat sep">–</div>
          <div class="stat"><span id="lossesVal">0</span><label>L</label></div>
          <button class="icon-btn" id="editRecordBtn" title="Edit record">✎</button>
        </div>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="plays">Favorite Plays</button>
      <button class="tab-btn" data-tab="reads">Pre-Snap Reads</button>
      <button class="tab-btn" data-tab="tips">Tips &amp; Notes</button>
    </nav>
  </header>

  <main>

    <section id="dashboard" class="tab-panel active">
      <div class="summary-grid">
        <div class="summary-card">
          <span class="summary-num" id="playsCount">0</span>
          <span class="summary-label">Favorite Plays</span>
        </div>
        <div class="summary-card">
          <span class="summary-num" id="readsCount">0</span>
          <span class="summary-label">Pre-Snap Reads</span>
        </div>
        <div class="summary-card">
          <span class="summary-num" id="tipsCount">0</span>
          <span class="summary-label">Tips &amp; Notes</span>
        </div>
        <div class="summary-card accent">
          <span class="summary-num" id="recordVal">0-0</span>
          <span class="summary-label">Dynasty Record</span>
        </div>
      </div>

      <div class="panel-head">
        <h2>Recently Added</h2>
      </div>
      <div id="recentList" class="recent-list"></div>
    </section>

    <section id="plays" class="tab-panel">
      <div class="panel-head">
        <h2>Favorite Plays</h2>
        <button class="btn primary" data-add="plays">+ Add Play</button>
      </div>
      <div class="filter-row">
        <input type="search" class="search-input" id="playsSearch" placeholder="Search plays, formations, situations…">
        <div class="chip-row" id="playsSideFilter">
          <button class="chip active" data-side="All">All</button>
          <button class="chip" data-side="Offense">Offense</button>
          <button class="chip" data-side="Defense">Defense</button>
        </div>
      </div>
      <div class="chip-row" id="playsTagFilter"></div>
      <div id="playsGrid" class="card-grid"></div>
    </section>

    <section id="reads" class="tab-panel">
      <div class="panel-head">
        <h2>Pre-Snap Reads</h2>
        <button class="btn primary" data-add="reads">+ Add Read</button>
      </div>
      <div class="filter-row">
        <input type="search" class="search-input" id="readsSearch" placeholder="Search reads, keys, adjustments…">
        <div class="chip-row" id="readsSideFilter">
          <button class="chip active" data-side="All">All</button>
          <button class="chip" data-side="Offense">On Offense</button>
          <button class="chip" data-side="Defense">On Defense</button>
        </div>
      </div>
      <div id="readsGrid" class="card-grid"></div>
    </section>

    <section id="tips" class="tab-panel">
      <div class="panel-head">
        <h2>Tips &amp; Notes</h2>
        <button class="btn primary" data-add="tips">+ Add Tip</button>
      </div>
      <div class="filter-row">
        <input type="search" class="search-input" id="tipsSearch" placeholder="Search tips…">
        <div class="chip-row" id="tipsCatFilter"></div>
      </div>
      <div id="tipsGrid" class="card-grid"></div>
    </section>

  </main>

  <footer class="toolbar">
    <span class="toolbar-hint">Data is saved automatically in this browser.</span>
    <div class="toolbar-actions">
      <button class="btn ghost" id="exportBtn">Export JSON</button>
      <button class="btn ghost" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn ghost danger" id="clearAllBtn">Clear All</button>
    </div>
  </footer>

</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const STORAGE_KEY = 'msuDynastyHub_v1';

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function defaultState() {
    const now = Date.now();
    return {
      dynastyName: 'My Dynasty Hub',
      record: { wins: 0, losses: 0 },
      theme: 'dark',
      plays: [
        {
          id: uid(), createdAt: now - 3000,
          title: 'Y-Cross Shot', side: 'Offense', formation: 'Gun Bunch',
          situation: '2nd/3rd & medium', rating: 5,
          tags: ['Play-Action', 'Man Beater'],
          notes: 'High-low read: post-snap check the MIKE. If he widens with the TE cross, drill the dig behind him. Great vs Cover 1/Cover 3 sky.'
        },
        {
          id: uid(), createdAt: now - 2000,
          title: 'Mint Cover 6', side: 'Defense', formation: 'Nickel 2-4-5',
          situation: '3rd & long', rating: 4,
          tags: ['Zone', 'Money'],
          notes: 'Rolls to a Cover 2 side / Cover 4 side. Great answer vs 4 verts and mesh concepts. Watch the deep middle seam on trips.'
        }
      ],
      reads: [
        {
          id: uid(), createdAt: now - 4000,
          title: 'Count the Safeties', context: 'Offense',
          lookFor: 'Number of deep safeties pre-snap.',
          adjustment: '1 deep safety → Cover 3 (zone) or Cover 1 (man). 2 deep safeties → Cover 4, Cover 6, Cover 9, Cover 2 zone, or Cover 2 man.',
          notes: ''
        },
        {
          id: uid(), createdAt: now - 3000,
          title: 'Utilize Motion', context: 'Offense',
          lookFor: 'Defender reaction to receiver motion.',
          adjustment: 'Defender follows → man. Defender stays/passes off → zone.',
          notes: ''
        },
        {
          id: uid(), createdAt: now - 2000,
          title: 'Cornerback Depth', context: 'Offense',
          lookFor: 'Corner depth off the line (with 2 high safeties).',
          adjustment: '7-9 yards off → deep third/quarter zone. 5 yards off → flat zone. Pressed at the line → man.',
          notes: ''
        },
        {
          id: uid(), createdAt: now - 1000,
          title: 'Cornerback Alignment', context: 'Offense',
          lookFor: 'Corner leverage on outside WR (with 2 high safeties).',
          adjustment: 'Press/head-up → Cover 3 or Cover 4 zone. Outside leverage → Cover 2 flat zone. Inside leverage → man.',
          notes: ''
        }
      ],
      tips: [
        {
          id: uid(), createdAt: now,
          title: 'Manual motion pre-snap', category: 'Controls & Sticks',
          notes: 'Send a manual motion on 3rd downs to bait the defense into showing man (they will follow) vs zone (they will pass off).'
        }
      ]
    };
  }

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return { ...defaultState(), ...parsed };
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ---------- Theme ----------
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    save();
  });

  // ---------- Dynasty name ----------
  const nameEl = document.getElementById('dynastyName');
  nameEl.textContent = state.dynastyName;
  nameEl.addEventListener('blur', () => {
    state.dynastyName = nameEl.textContent.trim() || 'My Dynasty Hub';
    nameEl.textContent = state.dynastyName;
    save();
  });
  nameEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
  });

  // ---------- Record tracker ----------
  function renderRecord() {
    document.getElementById('winsVal').textContent = state.record.wins;
    document.getElementById('lossesVal').textContent = state.record.losses;
    document.getElementById('recordVal').textContent = `${state.record.wins}-${state.record.losses}`;
  }
  document.getElementById('editRecordBtn').addEventListener('click', () => {
    const w = prompt('Wins:', state.record.wins);
    if (w === null) return;
    const l = prompt('Losses:', state.record.losses);
    if (l === null) return;
    state.record.wins = Math.max(0, parseInt(w, 10) || 0);
    state.record.losses = Math.max(0, parseInt(l, 10) || 0);
    renderRecord();
    save();
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- Filters state ----------
  const filters = {
    plays: { search: '', side: 'All', tag: null },
    reads: { search: '', side: 'All' },
    tips: { search: '', cat: null }
  };

  // ---------- Rendering: Plays ----------
  function allPlayTags() {
    const set = new Set();
    state.plays.forEach(p => (p.tags || []).forEach(t => set.add(t)));
    return [...set];
  }

  function renderPlaysTagFilter() {
    const wrap = document.getElementById('playsTagFilter');
    const tags = allPlayTags();
    wrap.innerHTML = '';
    if (!tags.length) return;
    const allChip = chip('All Tags', !filters.plays.tag, () => { filters.plays.tag = null; renderPlaysTagFilter(); renderPlays(); });
    wrap.appendChild(allChip);
    tags.forEach(t => {
      wrap.appendChild(chip(t, filters.plays.tag === t, () => {
        filters.plays.tag = filters.plays.tag === t ? null : t;
        renderPlaysTagFilter();
        renderPlays();
      }));
    });
  }

  function chip(label, active, onClick) {
    const b = document.createElement('button');
    b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function starsStr(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function renderPlays() {
    const grid = document.getElementById('playsGrid');
    const { search, side, tag } = filters.plays;
    const q = search.trim().toLowerCase();
    const items = state.plays
      .filter(p => side === 'All' || p.side === side)
      .filter(p => !tag || (p.tags || []).includes(tag))
      .filter(p => !q || [p.title, p.formation, p.situation, p.notes, ...(p.tags || [])].join(' ').toLowerCase().includes(q))
      .sort((a, b) => b.createdAt - a.createdAt);

    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div class="empty-msg">No plays yet. Add your first favorite play.</div>';
      return;
    }
    items.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="tag-pill ${p.side === 'Defense' ? 'side-defense' : ''}">${escapeHtml(p.side)}</span>
          <div class="card-actions">
            <button data-edit="${p.id}" title="Edit">✎</button>
            <button data-del="${p.id}" title="Delete">✕</button>
          </div>
        </div>
        <h3 class="card-title">${escapeHtml(p.title)}</h3>
        <div class="card-meta">${escapeHtml(p.formation || '')}${p.situation ? ' · ' + escapeHtml(p.situation) : ''}</div>
        ${p.rating ? `<div class="stars">${starsStr(p.rating)}</div>` : ''}
        <div class="card-body">${escapeHtml(p.notes || '')}</div>
        <div class="card-tags">${(p.tags || []).map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join('')}</div>
      `;
      card.querySelector(`[data-edit="${p.id}"]`).addEventListener('click', () => openPlayModal(p));
      card.querySelector(`[data-del="${p.id}"]`).addEventListener('click', () => removeItem('plays', p.id));
      grid.appendChild(card);
    });
  }

  document.getElementById('playsSearch').addEventListener('input', e => {
    filters.plays.search = e.target.value; renderPlays();
  });
  document.getElementById('playsSideFilter').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filters.plays.side = btn.dataset.side;
    document.querySelectorAll('#playsSideFilter .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderPlays();
  });

  // ---------- Rendering: Reads ----------
  function renderReads() {
    const grid = document.getElementById('readsGrid');
    const { search, side } = filters.reads;
    const q = search.trim().toLowerCase();
    const items = state.reads
      .filter(r => side === 'All' || r.context === side)
      .filter(r => !q || [r.title, r.lookFor, r.adjustment, r.notes].join(' ').toLowerCase().includes(q))
      .sort((a, b) => b.createdAt - a.createdAt);

    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div class="empty-msg">No pre-snap reads yet. Add your first key.</div>';
      return;
    }
    items.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="tag-pill ${r.context === 'Defense' ? 'side-defense' : ''}">On ${escapeHtml(r.context)}</span>
          <div class="card-actions">
            <button data-edit="${r.id}" title="Edit">✎</button>
            <button data-del="${r.id}" title="Delete">✕</button>
          </div>
        </div>
        <h3 class="card-title">${escapeHtml(r.title)}</h3>
        ${r.lookFor ? `<div class="card-meta"><strong>Look for:</strong> ${escapeHtml(r.lookFor)}</div>` : ''}
        ${r.adjustment ? `<div class="card-meta"><strong>Adjustment:</strong> ${escapeHtml(r.adjustment)}</div>` : ''}
        ${r.notes ? `<div class="card-body">${escapeHtml(r.notes)}</div>` : ''}
      `;
      card.querySelector(`[data-edit="${r.id}"]`).addEventListener('click', () => openReadModal(r));
      card.querySelector(`[data-del="${r.id}"]`).addEventListener('click', () => removeItem('reads', r.id));
      grid.appendChild(card);
    });
  }

  document.getElementById('readsSearch').addEventListener('input', e => {
    filters.reads.search = e.target.value; renderReads();
  });
  document.getElementById('readsSideFilter').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filters.reads.side = btn.dataset.side;
    document.querySelectorAll('#readsSideFilter .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderReads();
  });

  // ---------- Rendering: Tips ----------
  const TIP_CATEGORIES = ['Controls & Sticks', 'Gameplan & Sliders', 'Mental Game', 'Situational Football', 'Other'];

  function renderTipsCatFilter() {
    const wrap = document.getElementById('tipsCatFilter');
    wrap.innerHTML = '';
    wrap.appendChild(chip('All', !filters.tips.cat, () => { filters.tips.cat = null; renderTipsCatFilter(); renderTips(); }));
    TIP_CATEGORIES.forEach(c => {
      wrap.appendChild(chip(c, filters.tips.cat === c, () => {
        filters.tips.cat = filters.tips.cat === c ? null : c;
        renderTipsCatFilter();
        renderTips();
      }));
    });
  }

  function renderTips() {
    const grid = document.getElementById('tipsGrid');
    const { search, cat } = filters.tips;
    const q = search.trim().toLowerCase();
    const items = state.tips
      .filter(t => !cat || t.category === cat)
      .filter(t => !q || [t.title, t.notes, t.category].join(' ').toLowerCase().includes(q))
      .sort((a, b) => b.createdAt - a.createdAt);

    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div class="empty-msg">No tips yet. Jot down something you want to remember.</div>';
      return;
    }
    items.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="tag-pill">${escapeHtml(t.category)}</span>
          <div class="card-actions">
            <button data-edit="${t.id}" title="Edit">✎</button>
            <button data-del="${t.id}" title="Delete">✕</button>
          </div>
        </div>
        <h3 class="card-title">${escapeHtml(t.title)}</h3>
        <div class="card-body">${escapeHtml(t.notes || '')}</div>
      `;
      card.querySelector(`[data-edit="${t.id}"]`).addEventListener('click', () => openTipModal(t));
      card.querySelector(`[data-del="${t.id}"]`).addEventListener('click', () => removeItem('tips', t.id));
      grid.appendChild(card);
    });
  }

  document.getElementById('tipsSearch').addEventListener('input', e => {
    filters.tips.search = e.target.value; renderTips();
  });

  // ---------- Dashboard ----------
  function renderDashboard() {
    document.getElementById('playsCount').textContent = state.plays.length;
    document.getElementById('readsCount').textContent = state.reads.length;
    document.getElementById('tipsCount').textContent = state.tips.length;

    const all = [
      ...state.plays.map(x => ({ ...x, _type: 'Play' })),
      ...state.reads.map(x => ({ ...x, _type: 'Read' })),
      ...state.tips.map(x => ({ ...x, _type: 'Tip' }))
    ].sort((a, b) => b.createdAt - a.createdAt).slice(0, 6);

    const list = document.getElementById('recentList');
    list.innerHTML = '';
    if (!all.length) {
      list.innerHTML = '<div class="empty-msg">Nothing here yet — add a play, read, or tip to get started.</div>';
      return;
    }
    all.forEach(item => {
      const row = document.createElement('div');
      row.className = 'recent-item';
      row.innerHTML = `
        <span class="tag-pill">${item._type}</span>
        <span class="r-title">${escapeHtml(item.title)}</span>
        <span class="r-sub">${new Date(item.createdAt).toLocaleDateString()}</span>
      `;
      list.appendChild(row);
    });
  }

  // ---------- Shared remove ----------
  function removeItem(collection, id) {
    if (!confirm('Delete this entry?')) return;
    state[collection] = state[collection].filter(x => x.id !== id);
    save();
    renderAll();
    toast('Deleted');
  }

  function renderAll() {
    renderRecord();
    renderPlaysTagFilter();
    renderPlays();
    renderReads();
    renderTipsCatFilter();
    renderTips();
    renderDashboard();
  }

  // ---------- Modal helpers ----------
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modal');

  function closeModal() {
    overlay.classList.add('hidden');
    modal.innerHTML = '';
  }
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // ---------- Play modal ----------
  function openPlayModal(existing) {
    const isEdit = !!existing;
    const p = existing || { side: 'Offense', rating: 0, tags: [] };
    modal.innerHTML = `
      <h3>${isEdit ? 'Edit Play' : 'Add Favorite Play'}</h3>
      <form id="playForm">
        <div class="field">
          <label>Play Name</label>
          <input type="text" name="title" required value="${escapeHtml(p.title || '')}" placeholder="e.g. Y-Cross Shot">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Side</label>
            <select name="side">
              <option ${p.side === 'Offense' ? 'selected' : ''}>Offense</option>
              <option ${p.side === 'Defense' ? 'selected' : ''}>Defense</option>
            </select>
          </div>
          <div class="field">
            <label>Formation</label>
            <input type="text" name="formation" value="${escapeHtml(p.formation || '')}" placeholder="e.g. Gun Bunch">
          </div>
        </div>
        <div class="field">
          <label>Situation</label>
          <input type="text" name="situation" value="${escapeHtml(p.situation || '')}" placeholder="e.g. 3rd & long, Red Zone">
        </div>
        <div class="field">
          <label>Tags (comma separated)</label>
          <input type="text" name="tags" value="${escapeHtml((p.tags || []).join(', '))}" placeholder="e.g. Man Beater, Blitz Beater">
        </div>
        <div class="field">
          <label>Effectiveness</label>
          <div class="star-picker" id="starPicker"></div>
          <input type="hidden" name="rating" value="${p.rating || 0}">
        </div>
        <div class="field">
          <label>Notes / Read</label>
          <textarea name="notes" rows="4" placeholder="Key read, why it works, when to call it...">${escapeHtml(p.notes || '')}</textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary">${isEdit ? 'Save Changes' : 'Add Play'}</button>
        </div>
      </form>
    `;
    overlay.classList.remove('hidden');
    buildStarPicker(document.getElementById('starPicker'), modal.querySelector('[name="rating"]'), p.rating || 0);
    modal.querySelector('#cancelBtn').addEventListener('click', closeModal);
    modal.querySelector('#playForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const entry = {
        id: existing ? existing.id : uid(),
        createdAt: existing ? existing.createdAt : Date.now(),
        title: fd.get('title').trim(),
        side: fd.get('side'),
        formation: fd.get('formation').trim(),
        situation: fd.get('situation').trim(),
        tags: fd.get('tags').split(',').map(t => t.trim()).filter(Boolean),
        rating: parseInt(fd.get('rating'), 10) || 0,
        notes: fd.get('notes').trim()
      };
      if (existing) {
        const idx = state.plays.findIndex(x => x.id === existing.id);
        state.plays[idx] = entry;
      } else {
        state.plays.push(entry);
      }
      save();
      renderAll();
      closeModal();
      toast(isEdit ? 'Play updated' : 'Play added');
    });
  }

  function buildStarPicker(container, hiddenInput, initial) {
    container.innerHTML = '';
    let current = initial;
    for (let i = 1; i <= 5; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = '★';
      if (i <= current) b.classList.add('filled');
      b.addEventListener('click', () => {
        current = (current === i) ? 0 : i;
        hiddenInput.value = current;
        [...container.children].forEach((child, idx) => {
          child.classList.toggle('filled', idx < current);
        });
      });
      container.appendChild(b);
    }
  }

  // ---------- Read modal ----------
  function openReadModal(existing) {
    const isEdit = !!existing;
    const r = existing || { context: 'Offense' };
    modal.innerHTML = `
      <h3>${isEdit ? 'Edit Pre-Snap Read' : 'Add Pre-Snap Read'}</h3>
      <form id="readForm">
        <div class="field">
          <label>Title</label>
          <input type="text" name="title" required value="${escapeHtml(r.title || '')}" placeholder="e.g. Identify Mug Look">
        </div>
        <div class="field">
          <label>Context</label>
          <select name="context">
            <option ${r.context === 'Offense' ? 'selected' : ''}>Offense</option>
            <option ${r.context === 'Defense' ? 'selected' : ''}>Defense</option>
          </select>
        </div>
        <div class="field">
          <label>What to look for</label>
          <textarea name="lookFor" rows="3" placeholder="Pre-snap indicators / alignment clues...">${escapeHtml(r.lookFor || '')}</textarea>
        </div>
        <div class="field">
          <label>Adjustment / Counter</label>
          <textarea name="adjustment" rows="3" placeholder="Audible, hot route, blitz call, protection slide...">${escapeHtml(r.adjustment || '')}</textarea>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea name="notes" rows="3" placeholder="Anything else worth remembering...">${escapeHtml(r.notes || '')}</textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary">${isEdit ? 'Save Changes' : 'Add Read'}</button>
        </div>
      </form>
    `;
    overlay.classList.remove('hidden');
    modal.querySelector('#cancelBtn').addEventListener('click', closeModal);
    modal.querySelector('#readForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const entry = {
        id: existing ? existing.id : uid(),
        createdAt: existing ? existing.createdAt : Date.now(),
        title: fd.get('title').trim(),
        context: fd.get('context'),
        lookFor: fd.get('lookFor').trim(),
        adjustment: fd.get('adjustment').trim(),
        notes: fd.get('notes').trim()
      };
      if (existing) {
        const idx = state.reads.findIndex(x => x.id === existing.id);
        state.reads[idx] = entry;
      } else {
        state.reads.push(entry);
      }
      save();
      renderAll();
      closeModal();
      toast(isEdit ? 'Read updated' : 'Read added');
    });
  }

  // ---------- Tip modal ----------
  function openTipModal(existing) {
    const isEdit = !!existing;
    const t = existing || { category: TIP_CATEGORIES[0] };
    modal.innerHTML = `
      <h3>${isEdit ? 'Edit Tip' : 'Add Tip / Note'}</h3>
      <form id="tipForm">
        <div class="field">
          <label>Title</label>
          <input type="text" name="title" required value="${escapeHtml(t.title || '')}" placeholder="e.g. Manual motion pre-snap">
        </div>
        <div class="field">
          <label>Category</label>
          <select name="category">
            ${TIP_CATEGORIES.map(c => `<option ${t.category === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea name="notes" rows="4" placeholder="Write your tip or reminder...">${escapeHtml(t.notes || '')}</textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary">${isEdit ? 'Save Changes' : 'Add Tip'}</button>
        </div>
      </form>
    `;
    overlay.classList.remove('hidden');
    modal.querySelector('#cancelBtn').addEventListener('click', closeModal);
    modal.querySelector('#tipForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const entry = {
        id: existing ? existing.id : uid(),
        createdAt: existing ? existing.createdAt : Date.now(),
        title: fd.get('title').trim(),
        category: fd.get('category'),
        notes: fd.get('notes').trim()
      };
      if (existing) {
        const idx = state.tips.findIndex(x => x.id === existing.id);
        state.tips[idx] = entry;
      } else {
        state.tips.push(entry);
      }
      save();
      renderAll();
      closeModal();
      toast(isEdit ? 'Tip updated' : 'Tip added');
    });
  }

  // ---------- Add buttons ----------
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.add;
      if (type === 'plays') openPlayModal(null);
      if (type === 'reads') openReadModal(null);
      if (type === 'tips') openTipModal(null);
    });
  });

  // ---------- Export / Import / Clear ----------
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `msu-dynasty-hub-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Exported');
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        state = { ...defaultState(), ...parsed };
        applyTheme();
        nameEl.textContent = state.dynastyName;
        save();
        renderAll();
        toast('Imported');
      } catch (err) {
        alert('Could not read that file — make sure it is a valid export from this hub.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!confirm('This will erase all plays, reads, tips, and your record. Continue?')) return;
    state = defaultState();
    state.plays = []; state.reads = []; state.tips = [];
    applyTheme();
    nameEl.textContent = state.dynastyName;
    save();
    renderAll();
    toast('Cleared');
  });

  // ---------- Init ----------
  applyTheme();
  renderAll();
})();
</script>
</body>
</html>
